[project]
name = "eda-template"
version = "0.1.0"
description = "Reusable exploratory data analysis (EDA) notebook template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "statsmodels>=0.15.0",
]
